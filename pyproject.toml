[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reachfinder"
version = "0.1.0"
description = "Определение достижимости функции/метода из пакета-зависимости относительно исходного кода проекта"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "trailmark>=0.5.0,<0.6",
]

[project.scripts]
reachfinder = "reachfinder.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP",
    "ANN", "S", "B", "C4", "SIM",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN401", "ANN001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
